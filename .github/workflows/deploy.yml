name: montrax build and deploy
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: montrax-money-manager

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Jar
        run: mvn clean package -DskipTests=true

      - name: Building Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME}}:latest .

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME}}:latest

      - name: Deploy to Oracal Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script:
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME}}:latest
            docker stop ${{ secrets.OCI_CONTAINER_NAME }}
            docker rm ${{ secrets.OCI_CONTAINER_NAME }}
            docker run -d --name ${{ secrets.OCI_CONTAINER_NAME }} --restart unless-stopped --env-file /home/${{ secrets.OCI_USER }}/apps/app2/.env -v /home/${{ secrets.OCI_USER }}/apps/app2/certs:/app/certs:ro -p 8090:8090 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME}}:latest
            docker image prune -f
            
