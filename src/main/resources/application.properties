spring.application.name=moneymanager

# ===============================
# SERVER
# ===============================
server.port=8090

# Tomcat thread optimization for low memory server
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:10}
server.tomcat.threads.min-spare=2

# ===============================
# DATASOURCE (PostgreSQL / Neon)
# ===============================
spring.datasource.url=${DB_URI}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# CONNECTION POOL (HikariCP) - Optimized for low memory
# ===============================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# MAILJET SMTP CONFIGURATION
# ===============================

spring.mail.host=in-v3.mailjet.com
spring.mail.port=587

# Mailjet SMTP credentials
spring.mail.username=${MAILJET_API_KEY}
spring.mail.password=${MAILJET_SECRET_KEY}

# ===============================
# SMTP PROPERTIES
# ===============================

spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.from=${MAILJET_MAIL_FROM}

# ===============================
# DEBUG (configurable via env)
# ===============================
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# ===============================
# LOGGING CONFIGURATION
# Optimized to reduce startup noise
# ===============================
spring.main.banner-mode=off

# Compact console format - drops the PID and app-name bracket Spring Boot
# adds by default (redundant noise for a single-instance deployment) while
# keeping timestamp/level/thread/logger, which is what actually matters
# when reading a stack trace or tracing a request.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %clr(%-5level) %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n%wEx

logging.level.root=WARN
logging.level.org.springframework=${SPRING_LOG_LEVEL:WARN}
logging.level.org.springframework.web=${LOG_LEVEL:WARN}
logging.level.org.springframework.boot=${SPRING_BOOT_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.hibernate=${HIBERNATE_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.com.zaxxer.hikari=${HIKARI_LOG_LEVEL:WARN}
logging.level.org.mongodb.driver=${MONGO_LOG_LEVEL:WARN}
logging.level.io.lettuce=${REDIS_LOG_LEVEL:WARN}
logging.level.org.apache.tomcat=${TOMCAT_LOG_LEVEL:WARN}
logging.level.org.apache.catalina=${CATALINA_LOG_LEVEL:WARN}
logging.level.in.tracking.moneymanager=${APP_LOG_LEVEL:INFO}

# Suppress noisy framework startup logs
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.context.annotation=WARN
logging.level.org.springframework.beans.factory=WARN
logging.level.org.springframework.core.env=WARN


jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=86400000

money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL:http://localhost:5173}

# ===============================
# GOOGLE OAUTH2 LOGIN
# Get credentials from: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI to register there:
#   {backend-base-url}/login/oauth2/code/google
# Leave unset to disable Google sign-in (normal email/password login still works;
# dummy defaults keep Spring's OAuth2 autoconfig from failing to boot on an empty client-id)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-oauth2-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-oauth2-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===============================
# ADMIN SEED (first-run only; safe to leave unset after initial setup)
# ===============================
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# ===============================
# TEXTBEE OTP CONFIGURATION
# Get API key and device id from: https://textbee.dev
# ===============================
textbee.api.key=${TEXTBEE_API_KEY:}
textbee.device.id=${TEXTBEE_DEVICE_ID:}
textbee.api.url=${TEXTBEE_API_URL:https://api.textbee.dev/api/v1/gateway}

# ===============================
# RABBITMQ CONFIGURATION
# RABBITMQ_HOST is a full connection URI (amqp:// for local, amqps:// for a
# managed broker e.g. CloudAMQP) - scheme, user, pass, host, port and vhost
# all come from this one string. amqps:// auto-enables TLS, no extra flag needed.
# Falls back to a local guest/guest broker (e.g. docker compose --profile infra) when unset.
# Note: this project's Spring Boot version has no spring.rabbitmq.uri property,
# so RabbitMQConfig reads this custom key directly and builds the ConnectionFactory itself.
# ===============================
rabbitmq.uri=${RABBITMQ_HOST}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000

# ===============================
# KAFKA CONFIGURATION
# Leave KAFKA_USER unset for a plain local broker. When set, KafkaConfig auto-switches
# both producer and consumer to SASL_SSL (Aiven, Confluent Cloud, ...) - no separate
# protocol flag needed. KAFKA_TRUSTSTORE_LOCATION is a plain filesystem path to the
# broker's CA truststore (.jks). A broker that's briefly unreachable at boot (or a
# DNS hiccup resolving its hostname) no longer crashes the app - see KafkaListenerStarter.
# ===============================
kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}
kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:moneymanager-group}

kafka.sasl.username=${KAFKA_USER:}
kafka.sasl.password=${KAFKA_PASSWORD:}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}

# Everything below is passed straight through to the Kafka client as-is
# (kafka.properties.X.Y -> client property X.Y) - add more here freely.
kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_LOCATION:}
kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD:changeit}
kafka.properties.ssl.truststore.type=JKS
kafka.properties.ssl.endpoint.identification.algorithm=https

kafka.properties.connections.max.idle.ms=540000
kafka.properties.reconnect.backoff.ms=50
kafka.properties.reconnect.backoff.max.ms=1000
kafka.properties.request.timeout.ms=30000


# ===============================
# RAZORPAY CONFIGURATION
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# ===============================
# GOOGLE GEMINI AI
# Current model (March 2026): gemini-2.5-flash
# Free tier: 15 RPM, 250 RPD
# Get API key from: https://aistudio.google.com/app/apikey
# ===============================
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ===============================
# MONGODB CONFIGURATION
# Set MONGODB_URI to enable AI features
# Example: mongodb+srv://user:pass@cluster.mongodb.net/dbname
# Leave MONGODB_URI empty or unset to disable AI history persistence
# MongoDB auto-config is excluded by default and re-enabled when URI is set
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=${MONGODB_DATABASE:montrax}
spring.data.mongodb.auto-index-creation=true


# ===============================
# REDIS CONFIGURATION
# ===============================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# ===============================
# CACHE CONFIGURATION
# Use 'redis' for production, 'simple' for development without Redis
# ===============================
spring.cache.type=${CACHE_TYPE}

# ===============================
# FILE UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# CLOUDINARY CONFIGURATION
# Get credentials from: https://cloudinary.com/console
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# ACTUATOR (Health checks for Docker)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Disable MongoDB and Redis health indicators completely
# MongoDB is optional and used only for AI features
management.health.mongo.enabled=false
management.health.redis.enabled=false
management.health.defaults.enabled=true

# Exclude MongoDB from health check contributors
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
