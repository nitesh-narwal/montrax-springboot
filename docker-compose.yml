services:
  moneymanager-backend:
    image: montrax:v3
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneymanager-backend
    restart: unless-stopped

    # Resource limits - Spring Boot + Hibernate needs ~700-750MB total
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
        reservations:
          memory: 640M
          cpus: '0.25'

    # Use standard port mapping
    ports:
      - "8090:8090"

    # DNS settings for external services
    dns:
      - 8.8.8.8
      - 8.8.4.4

    # Environment variables
    environment:
      # JVM Memory Settings - Spring Boot + Hibernate + MongoDB needs adequate memory
      # Heap: 384MB, Metaspace: 256MB, plus native memory ~100MB
      JAVA_OPTS: "-Xmx384m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"

      # Database Configuration (External - Neon PostgreSQL)
      DB_URI: ${DB_URI}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # Mail Configuration (Mailjet)
      MAILJET_API_KEY: ${MAILJET_API_KEY}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY}
      MAILJET_MAIL_FROM: ${MAILJET_MAIL_FROM}

      # Razorpay Configuration
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # Google Gemini AI
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      # MongoDB (External)
      MONGODB_URI: ${MONGODB_URI:-}

      # Redis (External or disabled)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_TYPE: ${CACHE_TYPE:-simple}

      # Cloudinary Configuration
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Frontend URL (update for production)
      MONEY_MANAGER_FRONTEND_URL: ${MONEY_MANAGER_FRONTEND_URL:-http://localhost:5173}

      # Activation URL
      APP_ACTIVATION_URL: ${APP_ACTIVATION_URL:-http://localhost:8090}

      # Google OAuth2 Login (leave unset to disable Google sign-in)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled-oauth2-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled-oauth2-secret}

      # Admin Seed (first-run only; safe to leave unset after initial setup)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # TextBee OTP (SMS)
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY:-}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID:-}

      # RabbitMQ (full connection URI - amqp:// local, amqps:// managed broker)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-amqp://guest:guest@rabbitmq:5672}

      # Kafka (managed broker - leave KAFKA_USER unset for a plain local broker)
      KAFKA_HOST: ${KAFKA_HOST:-kafka}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      KAFKA_USER: ${KAFKA_USER:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_TRUSTSTORE_LOCATION: ${KAFKA_TRUSTSTORE_LOCATION:-}
      KAFKA_TRUSTSTORE_PASSWORD: ${KAFKA_TRUSTSTORE_PASSWORD:-changeit}

    # Environment file for secrets
    env_file:
      - .env

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check - use simple check that doesn't depend on actuator health status
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/subscription/plans"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Optional local infra (profile: infra). Not started by default since
  # production uses managed RabbitMQ/Kafka; enable with `docker compose --profile infra up`.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: moneymanager-rabbitmq
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:3.8.0
    container_name: moneymanager-kafka
    restart: unless-stopped
    profiles: ["infra"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    deploy:
      resources:
        limits:
          memory: 512M
